<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#107B75" />
    <title>Sin conexión · CobraVoz</title>
    <!--
      Página estática servida por el service worker. Es independiente de los
      bundles de Next.js, por eso replica los tokens de DESIGN.md con valores
      literales. Solo informa: no permite crear cobros ni muestra pagos.
    -->
    <style>
      :root {
        --canvas: #f6f8f5;
        --ink-900: #172d32;
        --ink-600: #506369;
        --teal-600: #107b75;
        --teal-700: #0e635f;
        --warning: #855716;
        --warning-soft: #fcf3de;
        --border: #d7e3de;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        background: var(--canvas);
        color: var(--ink-900);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 24px;
      }
      main {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      }
      .wordmark {
        margin: 0;
        color: var(--ink-900);
        font-size: 18px;
        font-weight: 700;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        align-self: flex-start;
        padding: 4px 12px;
        border-radius: 9999px;
        background: var(--warning-soft);
        color: var(--warning);
        font-size: 14px;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--ink-600);
      }
      button {
        height: 56px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: var(--teal-600);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover,
      button:active {
        background: var(--teal-700);
      }
      button:focus-visible {
        outline: 2px solid var(--teal-700);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">CobraVoz</p>
      <span class="status" role="status">
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
        Sin conexión
      </span>
      <h1>No podemos generar un cobro nuevo.</h1>
      <p>
        Revisa tu conexión a internet y vuelve a intentarlo. Los pagos que ya
        recibiste siguen registrados y los verás al volver a conectarte.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
